<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="static/css/style.css">
    <meta name="author" content="Benjamin Pardo">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="static/img/avion.png" type="image/x-icon">
    <title>cosas-flex</title>
</head>

<body>
    <main class="container">
        <div class="texto">
            <h1>Destinos destacados</h1>
            <p>Explora lugares increibles para tu próximo viaje</p>
        </div>
        <div class="contenedor-targetas">
            <div class="targetas">
                <div class="contenido-superior">
                    <img src="static/img/paine.jfif" alt="Torres del paine">
                    <h2>Torres del Paine</h2>
                    <p>Chile</p>
                </div>
                <div class="contenido-inferior">
                    <p>Naturaleza y paisajes únicos de la Patagonia</p>
                    <button class="ver-mas">Ver más</button>
                </div>
            </div>
            <div class="targetas">
                <div class="contenido-superior">
                    <img src="static/img/cusco.jfif" alt="Torres del paine">
                    <h2>Cusco</h2>
                    <p>Perú</p>
                </div>
                <div class="contenido-inferior">
                    <p>Cultura,historia y tradiciones</p>
                    <button class="ver-mas">Ver más</button>
                </div>
            </div>
            <div class="targetas">
                <div class="contenido-superior">
                    <img src="static/img/cancun.jfif" alt="Torres del paine">
                    <h2>Cancún</h2>
                    <p>Mexico</p>
                </div>
                <div class="contenido-inferior">
                    <p>Playas y descanso frente el mar</p>
                    <button class="ver-mas">Ver más</button>
                </div>
            </div>
            <div class="targetas">
                <div class="contenido-superior">
                    <img src="static/img/madrid.jfif" alt="Torres del paine">
                    <h2>Madrid</h2>
                    <p>España</p>
                </div>
                <div class="contenido-inferior">
                    <p>Gastronomía, museos y vida urbana</p>
                    <button class="ver-mas">Ver más</button>
                </div>
            </div>
        </div>
    </main>
    <script src="static/js/script.js"></script>
</body>

</html>
